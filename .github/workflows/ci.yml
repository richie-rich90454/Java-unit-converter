name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
          - os: windows-2025
            label: Windows
          - os: macos-26
            label: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build with Maven (targeting Java 8 bytecode)
        run: mvn clean package

      - name: Verify JAR structure
        shell: bash
        run: jar tf target/UnitConverter.jar | grep -q "com/unitconverter/App.class" && echo "JAR is valid"
