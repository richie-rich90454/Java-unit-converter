name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x64 / JDK 8
            java: 8
          - os: ubuntu-24.04
            label: Linux x64 / JDK 11
            java: 11
          - os: ubuntu-24.04
            label: Linux x64 / JDK 17
            java: 17
          - os: ubuntu-24.04
            label: Linux x64 / JDK 21
            java: 21
          - os: ubuntu-24.04-arm
            label: Linux arm64 / JDK 21
            java: 21
          - os: windows-2025
            label: Windows x64 / JDK 8
            java: 8
          - os: windows-2025
            label: Windows x64 / JDK 11
            java: 11
          - os: windows-2025
            label: Windows x64 / JDK 17
            java: 17
          - os: windows-2025
            label: Windows x64 / JDK 21
            java: 21
          - os: macos-26
            label: macOS arm64 / JDK 21
            java: 21
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build with Maven
        run: mvn clean package

      - name: Verify JAR structure
        shell: bash
        run: jar tf target/UnitConverter.jar | grep -q "com/unitconverter/App.class" && echo "JAR is valid"
