name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Leave empty for a dev build."
        required: false
        type: string

permissions:
  contents: write

env:
  APP_NAME: UnitConverter
  MAIN_CLASS: com.unitconverter.App

jobs:
  build-jar:
    name: Build JAR (Java 8 bytecode)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build with Maven (targeting Java 8 bytecode via --release 8)
        run: mvn clean package

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          if [ "$VER" = "main" ] || [ "$VER" = "" ]; then
            VER="dev-$(date +%Y%m%d)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: target/${{ env.APP_NAME }}.jar

  build-native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows x64
            installer-type: exe
            installer-ext: exe
            icon-flag: ""
          - os: macos-26
            name: macOS arm64
            installer-type: dmg
            installer-ext: dmg
            icon-flag: ""
          - os: ubuntu-24.04
            name: Linux x64
            installer-type: deb
            installer-ext: deb
            icon-flag: --icon src/main/resources/favicon.png
    runs-on: ${{ matrix.os }}
    needs: build-jar
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build with Maven (targeting Java 8 bytecode)
        run: mvn clean package

      - name: Create native installer (bundles JRE 25 -- no JVM required on target)
        env:
          APP_VERSION: ${{ needs.build-jar.outputs.version }}
        run: |
          jpackage \
            --type ${{ matrix.installer-type }} \
            --input target \
            --main-jar ${{ env.APP_NAME }}.jar \
            --main-class ${{ env.MAIN_CLASS }} \
            --name ${{ env.APP_NAME }} \
            --app-version "$APP_VERSION" \
            --description "Java Unit Converter" \
            --vendor "richie-rich90454" \
            ${{ matrix.icon-flag }} \
            --destination target/installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.name }}
          path: target/installer/*.${{ matrix.installer-ext }}

  publish-release:
    name: Publish Release
    needs: [build-jar, build-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        if: ${{ startsWith(github.ref_name, 'v') || github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ needs.build-jar.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
